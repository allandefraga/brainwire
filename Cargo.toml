[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/bolt", "crates/server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
proptest = "1"
tempfile = "3"
rocksdb = "0.25"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
