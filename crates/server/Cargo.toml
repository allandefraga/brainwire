[package]
name = "brainwire-server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "brainwire"
path = "src/main.rs"

[dependencies]
clap.workspace = true
toml.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
brainwire-core = { path = "../core" }
brainwire-store = { path = "../store" }
brainwire-cypher = { path = "../cypher" }
brainwire-tui = { path = "../tui" }
brainwire-bolt = { path = "../bolt" }
tokio.workspace = true
brainwire-replication = { path = "../replication" }
openraft.workspace = true
sha2.workspace = true
uuid.workspace = true
libc = "0.2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms", "background_threads_runtime_support"] }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
tikv-jemalloc-sys = "0.7"

[dev-dependencies]
brainwire-store = { path = "../store", features = ["test-fault-injection"] }
tempfile.workspace = true
rocksdb.workspace = true
