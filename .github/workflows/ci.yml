name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and Bolt acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CXXFLAGS: -g0
    steps:
      - uses: actions/checkout@v6

      - name: Install RocksDB build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev cmake pkg-config

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt

      - name: Restore Rust build artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check runner disk space
        run: df -h "$GITHUB_WORKSPACE"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --locked --offline

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Report runner disk space after Rust checks
        if: always()
        run: df -h "$GITHUB_WORKSPACE"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Python client helpers
        run: python -m unittest discover -s examples/python -p 'test_*.py'

      - name: Test local release versioning
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Build server for real Bolt acceptance
        run: cargo build --locked --offline -p brainwire-server --bin brainwire

      - name: Install Neo4j Bolt driver
        run: python -m pip install neo4j==5.28.7

      - name: Verify Python ingestion, edge deletion and restart recovery
        run: >-
          python crates/server/tests/python_ingestion.py
          --binary target/debug/brainwire --rows 100 --batch-size 25 --query-mib 32

      - name: Save Rust build artifacts
        if: ${{ always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
