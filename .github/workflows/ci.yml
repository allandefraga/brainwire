name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and Bolt acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CXXFLAGS: -g0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install RocksDB build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev cmake pkg-config

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt

      - name: Restore Rust build artifacts
        id: rust-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check runner disk space
        run: df -h "$GITHUB_WORKSPACE"

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Integration tests launch these executables through CARGO_BIN_EXE_*.
      # Build them explicitly so partial CI cache restores cannot leave those
      # paths pointing at missing executables.
      - name: Build executables required by tests
        run: cargo build --locked --offline --workspace --bins

      - name: Run workspace tests
        run: cargo test --workspace --locked --offline

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Report runner disk space after Rust checks
        if: always()
        run: df -h "$GITHUB_WORKSPACE"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Neo4j Bolt driver
        run: python -m pip install neo4j==5.28.4 duckdb==1.5.5

      - name: Install DuckLake test extensions
        run: python -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL ducklake; INSTALL sqlite; LOAD ducklake; LOAD sqlite')"

      - name: Test Python client helpers
        run: python -m unittest discover -s examples/python -p 'test_*.py'

      - name: Test local release versioning
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Test comparison runner safety
        run: |
          python -m venv "$RUNNER_TEMP/brainwire-comparison"
          "$RUNNER_TEMP/brainwire-comparison/bin/pip" install -r benchmarks/comparison/requirements.txt
          "$RUNNER_TEMP/brainwire-comparison/bin/python" -m unittest discover -s benchmarks/comparison -p 'test_*.py'

      - name: Test cgroup diagnostic safety
        run: python -m unittest discover -s crates/server/tests -p 'test_cgroup*.py'

      - name: Test Kubernetes CSI diagnostic safety
        run: python -m unittest discover -s crates/server/tests -p 'test_kubernetes_csi_handoff.py'

      - name: Test TLS diagnostic configuration
        run: python -m unittest discover -s crates/server/tests -p 'test_compose_tls.py'

      - name: Validate documentation links and site
        run: |
          python scripts/check_docs_links.py
          python scripts/check_docs_site.py

      - name: Verify Python ingestion, edge deletion and restart recovery
        run: >-
          python crates/server/tests/python_ingestion.py
          --binary target/debug/brainwire --rows 100 --batch-size 25 --query-mib 32

      - name: Verify DuckLake checkpoint contracts and incremental sync
        run: >-
          python crates/server/tests/ducklake_sync.py
          --binary target/debug/brainwire --rows 100 --workers 2

      - name: Verify recovery after an unacknowledged commit
        run: >-
          python crates/server/tests/uncertain_commit.py
          --binary target/debug/brainwire --rows 32

      - name: Verify context evidence and ACL isolation
        run: python crates/server/tests/context_rerank.py --binary target/debug/brainwire

      - name: Verify bounded context over Bolt
        run: python crates/server/tests/context_budget.py --binary target/debug/brainwire

      - name: Verify provider search and ACL isolation
        run: python crates/server/tests/context_search.py --binary target/debug/brainwire

      - name: Verify semantic paths and agent evidence
        run: python crates/server/tests/semantic_paths.py --binary target/debug/brainwire

      - name: Verify visible instance paths
        run: python crates/server/tests/context_paths.py --binary target/debug/brainwire

      - name: Verify code graph snapshots and replay
        run: python crates/server/tests/code_graph.py --binary target/debug/brainwire

      - name: Verify the synthetic company-context example
        run: python crates/server/tests/company_brain.py --binary target/debug/brainwire

      - name: Verify timeline pagination and ACL isolation
        run: python crates/server/tests/timeline_page.py --binary target/debug/brainwire

      - name: Verify quorum failover and identified-write recovery
        timeout-minutes: 10
        run: >-
          python crates/server/tests/quorum_replication.py
          --binary target/debug/brainwire --rows 20

      - name: Verify populated volume upgrade from previous release
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --first-parent --tags --match 'v[0-9]*' --match 'clean/v[0-9]*' --abbrev=0 HEAD^)"
          previous_revision="$(git rev-parse "${previous_tag}^{commit}")"
          candidate_revision="$(git rev-parse HEAD)"
          old_source="$(mktemp -d "${RUNNER_TEMP}/brainwire-old-source.XXXXXX")"
          trap 'rm -rf "$old_source"' EXIT
          git archive "$previous_revision" | tar -x -C "$old_source"
          cp target/debug/brainwire "$RUNNER_TEMP/brainwire-candidate"
          cargo fetch --locked --manifest-path "$old_source/Cargo.toml"
          # Rebuild archived workspace crates; keep cached native dependencies.
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo clean --locked --offline \
            --manifest-path "$old_source/Cargo.toml" --workspace
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked --offline \
            --manifest-path "$old_source/Cargo.toml" -p brainwire-server --bin brainwire
          cp target/debug/brainwire "$RUNNER_TEMP/brainwire-previous"
          python crates/server/tests/volume_upgrade.py \
            --old-binary "$RUNNER_TEMP/brainwire-previous" \
            --new-binary "$RUNNER_TEMP/brainwire-candidate" \
            --old-revision "$previous_revision" --new-revision "$candidate_revision" \
            --rows 32 > "$RUNNER_TEMP/brainwire-volume-upgrade.json"
          cat "$RUNNER_TEMP/brainwire-volume-upgrade.json"

      - name: Upload volume upgrade receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brainwire-volume-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brainwire-volume-upgrade.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Rust build artifacts
        if: ${{ always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/build
            target/debug/deps
            target/debug/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
