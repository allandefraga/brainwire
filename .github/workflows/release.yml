name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    name: Verify Linux ${{ matrix.arch }} image
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/brainwire
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - name: Match tag to workspace version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          actual = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-(?:beta|rc)\.\d+)?", actual):
              raise SystemExit("unsupported release tag")
          if actual != f"v{version}":
              raise SystemExit("tag does not match workspace version")
          PY
          grep -F "newTag: ${RELEASE_TAG}" deploy/kubernetes-release/kustomization.yaml
          echo "CANDIDATE=$IMAGE_REPOSITORY:$RELEASE_TAG-$GITHUB_SHA-$ARCH" >> "$GITHUB_ENV"

      - name: Set up native Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/brainwire
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a previously tested candidate
        id: candidate
        run: |
          if docker manifest inspect "$CANDIDATE" >/dev/null 2> candidate-inspect.err; then
            docker pull --platform "linux/$ARCH" "$CANDIDATE"
            revision="$(docker image inspect "$CANDIDATE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            architecture="$(docker image inspect "$CANDIDATE" --format '{{.Architecture}}')"
            test "$revision" = "$GITHUB_SHA"
            test "$architecture" = "$ARCH"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            # Do not treat authentication or network errors as an absent image.
            grep -Eiq 'manifest unknown|no such manifest' candidate-inspect.err || {
              cat candidate-inspect.err >&2
              exit 1
            }
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the candidate on its native architecture
        if: steps.candidate.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.CANDIDATE }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the Bolt acceptance driver
        run: python -m pip install neo4j==5.28.4

      - name: Verify private credential setup as the image user
        run: |
          docker run --rm --network none "$CANDIDATE" auth init --directory /tmp/brainwire-auth --graph default

      - name: Verify the exact image and retained-volume recovery
        run: |
          architecture="$(docker image inspect "$CANDIDATE" --format '{{.Architecture}}')"
          test "$architecture" = "$ARCH"
          python crates/server/tests/container_restart.py --image "$CANDIDATE" --rows 100 --cycles 1

      - name: Publish only the verified candidate and record its digest
        env:
          ALREADY_EXISTS: ${{ steps.candidate.outputs.exists }}
        run: |
          if [[ "$ALREADY_EXISTS" != "true" ]]; then
            docker push "$CANDIDATE"
          fi
          docker pull --platform "linux/$ARCH" "$CANDIDATE"
          repository_digest="$(docker image inspect "$CANDIDATE" --format '{{index .RepoDigests 0}}')"
          test "${repository_digest%@*}" = "$IMAGE_REPOSITORY"
          digest="${repository_digest##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-metadata
          printf '%s\n' "$digest" > "image-metadata/$ARCH.digest"

      - name: Save the tested architecture digest
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.arch }}
          path: image-metadata/${{ matrix.arch }}.digest
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish multi-architecture release
    needs: [verify, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/brainwire:${{ github.ref_name }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/brainwire
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: image-metadata
          merge-multiple: true

      - name: Create the manifest from tested digests without replacing a release
        run: |
          amd64="$(cat image-metadata/amd64.digest)"
          arm64="$(cat image-metadata/arm64.digest)"
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          if ! docker manifest inspect "$RELEASE_IMAGE" > manifest.json 2> release-inspect.err; then
            grep -Eiq 'manifest unknown|no such manifest' release-inspect.err || {
              cat release-inspect.err >&2
              exit 1
            }
            docker buildx imagetools create --tag "$RELEASE_IMAGE" \
              "$IMAGE_REPOSITORY@$amd64" "$IMAGE_REPOSITORY@$arm64"
            docker manifest inspect "$RELEASE_IMAGE" > manifest.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text())
          actual = {}
          for item in manifest.get("manifests", []):
              platform = item.get("platform", {})
              key = (platform.get("os"), platform.get("architecture"))
              if key in actual:
                  raise SystemExit("duplicate architecture in release manifest")
              actual[key] = item["digest"]
          expected = {
              ("linux", arch): Path(f"image-metadata/{arch}.digest").read_text().strip()
              for arch in ("amd64", "arm64")
          }
          if actual != expected:
              raise SystemExit("release manifest does not match the tested architecture digests; refusing replacement")
          PY
          digest="$(docker buildx imagetools inspect "$RELEASE_IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s\ndigest=%s\nsource=%s\nlinux_amd64=%s\nlinux_arm64=%s\n' \
            "$RELEASE_IMAGE" "$digest" "$GITHUB_SHA" "$amd64" "$arm64" > release-metadata.txt
          cat release-metadata.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Create or verify the GitHub prerelease
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p .release-check
            gh release download "$RELEASE_TAG" --pattern release-metadata.txt --dir .release-check
            cmp release-metadata.txt .release-check/release-metadata.txt
            actual="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')"
            expected=false
            [[ "$RELEASE_TAG" == *-* ]] && expected=true
            test "$actual" = "$expected"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --title "Brainwire $RELEASE_TAG" \
              --generate-notes --prerelease release-metadata.txt
          else
            gh release create "$RELEASE_TAG" --title "Brainwire $RELEASE_TAG" \
              --generate-notes release-metadata.txt
          fi
