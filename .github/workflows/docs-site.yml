name: Documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Markdown link targets
        run: python scripts/check_docs_links.py

      - name: Build and validate the documentation site
        run: |
          python -m pip install -r scripts/docs-site-requirements.txt
          python scripts/build_docs_site.py _site
          python scripts/check_docs_site.py _site

      - name: Package documentation preview
        if: github.repository_visibility == 'private'
        uses: actions/upload-artifact@v4
        with:
          name: brainwire-docs-preview-${{ github.sha }}
          path: _site/
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.repository_visibility == 'public'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: github.repository_visibility == 'public'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: github.repository_visibility == 'public'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
