apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: brainwire-client-access
spec:
  podSelector:
    matchLabels:
      app: brainwire
  policyTypes:
    - Ingress
  ingress:
    - from:
        # A podSelector alone selects clients in this policy's namespace.
        - podSelector:
            matchLabels:
              brainwire-client: "true"
      ports:
        - protocol: TCP
          port: 7687
