version: "3.8"
services:
  brainwire:
    image: ${BRAINWIRE_IMAGE:-brainwire:local}
    environment:
      BRAINWIRE_SERVER_DATA_DIR: /data
      BRAINWIRE_SERVER_LISTEN: 0.0.0.0:7687
      BRAINWIRE_MEMORY_CACHE: 256MiB
      BRAINWIRE_MEMORY_MEMTABLES: 32MiB
      BRAINWIRE_MEMORY_QUERY: 256MiB
    volumes:
      - brainwire-data:/data
    networks:
      - brainwire
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "brainwire", "probe", "--mode", "ready", "--timeout-ms", "500"]
      interval: 10s
      timeout: 5s
      start_period: 15m
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.id == ${BRAINWIRE_SWARM_NODE_ID:?Set the node ID that owns the retained volume}"
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M

volumes:
  brainwire-data:
    external: true
    name: brainwire-swarm-data

networks:
  brainwire:
    driver: overlay
    attachable: true
