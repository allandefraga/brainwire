apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes-public-release
patches:
  - target:
      kind: StatefulSet
      name: brainwire
    patch: |-
      - op: test
        path: /spec/volumeClaimTemplates/0/metadata/name
        value: data
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/accessModes
        value:
          - ReadWriteOncePod
