global
    log stdout format raw local0
    maxconn 128
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend bolt_tls
    bind :7688 ssl crt /run/secrets/brainwire-tls.pem
    default_backend bolt_local

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

backend bolt_local
    server brainwire brainwire:7687 check inter 2s resolvers docker init-addr libc,none
