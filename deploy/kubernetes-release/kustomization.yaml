apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes
images:
  - name: brainwire
    newName: ghcr.io/allandefraga/brainwire
    newTag: v0.2.0-beta.1
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: brainwire
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: brainwire
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-pull
