<text x="44" y="84" fill="#9eacc0" font-family="system-ui,sans-serif" font-size="14">10,000 nodes · 20,000 directed edges · 2 CPU / 4 GiB cap · 5 read/update repeats</text>
<text x="44" y="131" fill="#d9e5f5" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Read latency · p95 (ms) · lower is better</text>
