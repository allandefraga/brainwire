<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" role="img" aria-labelledby="title desc">
<title id="title">Creating 1M nodes and 2M edges</title>
<desc id="desc">Median creation times across three synthetic runs. Brainwire: 11.05 seconds for nodes and 27.94 for edges. FalkorDB: 4.51 seconds for nodes and 17.41 for edges. Neo4j: 11.49 seconds for nodes and 23.47 for edges.</desc>
