<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Brainwire — connected graph data</title>
  <desc id="desc">A synthetic graph of people, projects, documents and events. Atlas launch connects to Maya Chen, a design brief, an API rollout and a support ticket, with surrounding nodes showing their wider context.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100c"/><stop offset=".55" stop-color="#080e0d"/><stop offset="1" stop-color="#071312"/></linearGradient>
    <radialGradient id="wash"><stop stop-color="#234c28" stop-opacity=".32"/><stop offset="1" stop-color="#07100c" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#3c6851" opacity=".24"/></pattern>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4 2-4z" fill="#57ff48"/></marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4 2-4z" fill="#67d9d2"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .context{fill:none;stroke:#24463b;stroke-width:2}.link{fill:none;stroke:#437d70;stroke-width:2.5}.focus{fill:none;stroke:#57ff48;stroke-width:3.5;marker-end:url(#arrow-green)}.active{fill:none;stroke:#67d9d2;stroke-width:3;marker-end:url(#arrow-cyan)}
      .label{fill:#eaf4ed;font-size:29px;font-weight:650;letter-spacing:-.5px}.type{fill:#88a398;font-size:20px}.small{fill:#a3b9ae;font-size:21px}.edge-label{font-size:18px;font-weight:600;letter-spacing:1px}.orbit{fill:#0d1b15;stroke:#355c48;stroke-width:2}.cyan-node{fill:#0d211e;stroke:#67d9d2;stroke-width:3}.green-node{fill:#102415;stroke:#57ff48;stroke-width:3}
    </style>
  </defs>
  <rect width="1600" height="820" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1598" height="818" rx="27" fill="none" stroke="#20372d"/>
  <rect x="1" y="1" width="1598" height="818" rx="27" fill="url(#dots)"/>
  <ellipse cx="802" cy="408" rx="650" ry="395" fill="url(#wash)"/>

  <g class="mono" fill="#57ff48">
    <path d="m58 51 15 15 15-15M73 66l15 15M58 81l15-15" fill="none" stroke="#57ff48" stroke-width="2.5"/>
    <circle cx="58" cy="51" r="4"/><circle cx="58" cy="81" r="4"/><circle cx="73" cy="66" r="4.5"/><circle cx="88" cy="51" r="4"/><circle cx="88" cy="81" r="4"/>
    <text x="108" y="75" font-size="25" font-weight="700" letter-spacing="2">BRAINWIRE</text>
  </g>
  <text x="1542" y="73" text-anchor="end" class="mono small" fill="#88a398">SYNTHETIC GRAPH</text>
  <path d="M58 105H1542" stroke="#1b3429"/>

  <!-- The surrounding network uses ordinary records, not schema type boxes. -->
  <g class="context">
    <path d="M145 229 215 379 130 553 278 676 470 603M145 229 316 182 393 315M215 379 393 315M215 379 470 603M278 676 563 708 707 610M316 182 588 164 789 359M393 315 588 164M588 164 984 150 1232 280M984 150 1362 166 1450 352M1232 280 1450 352 1398 559 1131 557M1398 559 1324 708 1080 711 1131 557M707 610 1080 711M470 603 707 610M789 359 707 610M1131 557 707 610"/>
    <path d="M130 553 393 315M563 708 789 359M1232 280 1398 559M984 150 1131 557" stroke-dasharray="4 9" opacity=".6"/>
  </g>
  <g class="link">
    <path d="M393 315Q563 246 737 346"/>
    <path d="M843 349Q1016 206 1192 267"/>
    <path d="M835 401Q989 455 1098 536"/>
    <path d="M752 404Q615 527 503 582"/>
    <path d="M430 343Q459 439 470 566"/>
    <path d="M508 601Q809 694 1095 572"/>
  </g>

  <!-- Highlight one readable path through the synthetic graph. -->
  <path d="M431 316Q578 284 739 351" class="focus"/>
  <path d="M760 409Q649 532 508 586" class="focus"/>
  <path d="M843 373Q992 402 1098 532" class="active"/>
  <path d="M841 348Q1002 246 1190 271" class="active"/>

  <g class="mono edge-label">
    <rect x="525" y="271" width="132" height="36" rx="18" fill="#102016" stroke="#2a4f32"/><text x="591" y="295" text-anchor="middle" fill="#9df193">WORKS_ON</text>
    <rect x="564" y="485" width="142" height="36" rx="18" fill="#102016" stroke="#2a4f32"/><text x="635" y="509" text-anchor="middle" fill="#9df193">HAS_BRIEF</text>
    <rect x="954" y="411" width="118" height="36" rx="18" fill="#0c211d" stroke="#27554b"/><text x="1013" y="435" text-anchor="middle" fill="#91ded6">DEPENDS_ON</text>
  </g>

  <g class="orbit">
    <circle cx="145" cy="229" r="10"/><circle cx="215" cy="379" r="15"/><circle cx="130" cy="553" r="9"/><circle cx="278" cy="676" r="12"/><circle cx="316" cy="182" r="12"/><circle cx="588" cy="164" r="15"/><circle cx="563" cy="708" r="10"/><circle cx="707" cy="610" r="14"/><circle cx="984" cy="150" r="12"/><circle cx="1362" cy="166" r="10"/><circle cx="1450" cy="352" r="14"/><circle cx="1398" cy="559" r="11"/><circle cx="1324" cy="708" r="10"/><circle cx="1080" cy="711" r="12"/>
  </g>
  <g fill="#67d9d2"><circle cx="215" cy="379" r="4"/><circle cx="588" cy="164" r="4"/><circle cx="1450" cy="352" r="4"/><circle cx="707" cy="610" r="4"/><circle cx="1080" cy="711" r="4"/></g>

  <!-- Five named nodes give the network an understandable story. -->
  <g transform="translate(393 315)">
    <circle r="43" fill="#0b1710" stroke="#294a32"/>
    <circle r="32" class="green-node"/>
    <circle cy="-7" r="7" fill="#57ff48"/><path d="M-12 15c0-14 24-14 24 0" fill="none" stroke="#57ff48" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="sans" text-anchor="middle"><text x="393" y="382" class="label">Maya Chen</text><text x="393" y="410" class="type">Person</text></g>

  <g transform="translate(789 373)">
    <circle r="68" fill="#0b180f" stroke="#254c29"/>
    <circle r="54" fill="#15371b" stroke="#57ff48" stroke-width="3.5"/>
    <path d="m-19-13 19-11 19 11v26L0 24-19 13zM-19-13 0-2l19-11M0-2v26" fill="none" stroke="#57ff48" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="sans" text-anchor="middle"><text x="789" y="474" class="label" style="font-size:36px;fill:#c7ffc3">Atlas launch</text><text x="789" y="506" class="type">Project</text></g>

  <g transform="translate(470 603)">
    <circle r="43" fill="#0b1710" stroke="#294a32"/>
    <circle r="32" class="green-node"/>
    <path d="M-9-15H5l8 8v23H-9zM5-15v8h8M-3 1h10M-3 7h10" fill="none" stroke="#57ff48" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g class="sans" text-anchor="middle"><text x="470" y="670" class="label">Design brief</text><text x="470" y="698" class="type">Document</text></g>

  <g transform="translate(1232 280)">
    <circle r="43" fill="#0a1917" stroke="#224b43"/>
    <circle r="32" class="cyan-node"/>
    <path d="M-14-10h28v17H3l-8 8V7h-9z" fill="none" stroke="#67d9d2" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g class="sans" text-anchor="middle"><text x="1232" y="347" class="label">Support ticket</text><text x="1232" y="375" class="type">Ticket</text></g>

  <g transform="translate(1131 557)">
    <circle r="43" fill="#0a1917" stroke="#224b43"/>
    <circle r="32" class="cyan-node"/>
    <path d="m-11-8-9 8 9 8M11-8l9 8-9 8M5-15-5 15" fill="none" stroke="#67d9d2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="sans" text-anchor="middle"><text x="1131" y="624" class="label">API rollout</text><text x="1131" y="652" class="type">Deployment</text></g>

  <path d="M58 757H1542" stroke="#1b3429"/>
  <g class="sans small"><text x="58" y="794">People, projects, documents — and the relationships between them.</text><text x="1542" y="794" text-anchor="end" fill="#57ff48">Context has connections.</text></g>
</svg>
