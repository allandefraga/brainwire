<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" role="img" aria-labelledby="title desc">
<title id="title">Creating 1M nodes and 2M edges</title>
<desc id="desc">Median creation times across three synthetic runs. Brainwire: 9.82 seconds for nodes and 24.69 for edges. FalkorDB: 4.45 seconds for nodes and 15.92 for edges. Neo4j: 10.27 seconds for nodes and 21.22 for edges.</desc>
