<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Brainwire synthetic ontology explorer</title>
  <desc id="desc">A dark green graph workbench showing Person, Project, Document and Topic types and their allowed relationships.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#193024" stroke-width="1"/></pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100b"/><stop offset="1" stop-color="#0b1710"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#57FF48"/><stop offset="1" stop-color="#28c967"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67D9D2"/></marker>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.body{fill:#e9f2ec}.muted{fill:#91a89a}.green{fill:#57ff48}.cyan{fill:#67d9d2}.line{stroke:#294636}.card{fill:#0c1710;stroke:#31513c;stroke-width:2}.small{font-size:16px;letter-spacing:1px}.label{font-size:13px;letter-spacing:2px}.title{font-size:24px;font-weight:700}.edge{fill:none;stroke:#67d9d2;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="28" fill="url(#grid)" opacity=".56"/>
  <circle cx="780" cy="445" r="240" fill="#28c967" opacity=".09" filter="url(#soft)"/>
  <rect x="22" y="22" width="1556" height="856" rx="18" fill="none" stroke="#294636" stroke-width="2"/>
  <rect x="42" y="42" width="1516" height="72" rx="8" fill="#08120c" stroke="#31513c"/>
  <g transform="translate(62 57) scale(.32)"><path d="M26 28 78 80 26 132M78 80l52-52M78 80l52 52M130 28l23 52-23 52M78 80h75" fill="none" stroke="#57ff48" stroke-width="9" stroke-linecap="round"/><circle cx="78" cy="80" r="13" fill="#67d9d2"/><circle cx="26" cy="28" r="10" fill="#57ff48"/><circle cx="26" cy="132" r="10" fill="#57ff48"/><circle cx="153" cy="80" r="11" fill="#57ff48"/></g>
  <text x="126" y="88" class="mono body" font-size="28" font-weight="700" letter-spacing="2">BRAINWIRE</text>
  <text x="390" y="86" class="mono cyan small">ONTOLOGY / EXPLORER</text>
  <text x="1390" y="86" class="mono green small">SYNTHETIC</text>

  <rect x="42" y="138" width="230" height="674" rx="10" class="card"/>
  <text x="70" y="180" class="mono muted label">MODEL</text>
  <text x="70" y="216" class="mono body title">4 types</text>
  <g class="mono small">
    <rect x="58" y="250" width="198" height="52" rx="7" fill="#13251a" stroke="#57ff48" stroke-width="2"/><circle cx="82" cy="276" r="7" fill="#57ff48"/><text x="102" y="282" class="green">Person</text>
    <circle cx="82" cy="334" r="7" fill="#67d9d2"/><text x="102" y="340" class="body">Project</text>
    <circle cx="82" cy="392" r="7" fill="#67d9d2"/><text x="102" y="398" class="body">Document</text>
    <circle cx="82" cy="450" r="7" fill="#67d9d2"/><text x="102" y="456" class="body">Topic</text>
  </g>
  <path d="M60 494H254" class="line"/>
  <text x="70" y="532" class="mono muted label">CONNECTIONS</text>
  <text x="70" y="568" class="mono body small">OWNS</text><text x="70" y="596" class="mono body small">REFERENCES</text><text x="70" y="624" class="mono body small">MENTIONS</text><text x="70" y="652" class="mono body small">WORKS_ON</text>
  <rect x="60" y="704" width="194" height="74" rx="6" fill="#09120c" stroke="#294636"/>
  <text x="76" y="735" class="mono green label">SCHEMA V3</text><text x="76" y="760" class="mono muted" font-size="13">Allowed shapes only</text>

  <rect x="292" y="138" width="932" height="674" rx="10" class="card"/>
  <text x="324" y="181" class="mono muted label">ALLOWED GRAPH SHAPES</text>
  <text x="324" y="220" class="mono body" font-size="20">Select a type to inspect its properties and links.</text>
  <path d="M613 380C684 320 744 320 802 380" class="edge"/>
  <path d="M953 414C1020 460 1040 512 1004 570" class="edge"/>
  <path d="M824 626C737 682 663 680 608 624" class="edge"/>
  <path d="M489 568C437 508 444 435 494 412" class="edge"/>
  <g class="mono cyan label"><rect x="674" y="318" width="94" height="30" rx="14" fill="#0b211b" stroke="#31513c"/><text x="692" y="338">OWNS</text><rect x="1006" y="466" width="134" height="30" rx="14" fill="#0b211b" stroke="#31513c"/><text x="1022" y="486">REFERENCES</text><rect x="664" y="664" width="126" height="30" rx="14" fill="#0b211b" stroke="#31513c"/><text x="680" y="684">MENTIONS</text><rect x="362" y="468" width="120" height="30" rx="14" fill="#0b211b" stroke="#31513c"/><text x="378" y="488">WORKS_ON</text></g>
  <g class="mono">
    <rect x="410" y="354" width="206" height="110" rx="10" fill="#102016" stroke="#57ff48" stroke-width="3"/><circle cx="440" cy="385" r="7" fill="#57ff48"/><text x="460" y="392" class="green title">Person</text><path d="M432 416H594" class="line"/><text x="432" y="444" class="muted" font-size="14">entity_id · name · role</text>
    <rect x="802" y="354" width="206" height="110" rx="10" class="card"/><circle cx="832" cy="385" r="7" fill="#67d9d2"/><text x="852" y="392" class="cyan title">Project</text><path d="M824 416H986" class="line"/><text x="824" y="444" class="muted" font-size="14">entity_id · title · status</text>
    <rect x="884" y="570" width="206" height="110" rx="10" class="card"/><circle cx="914" cy="601" r="7" fill="#67d9d2"/><text x="934" y="608" class="cyan title">Document</text><path d="M906 632H1068" class="line"/><text x="906" y="660" class="muted" font-size="14">entity_id · title · source</text>
    <rect x="474" y="570" width="206" height="110" rx="10" class="card"/><circle cx="504" cy="601" r="7" fill="#67d9d2"/><text x="524" y="608" class="cyan title">Topic</text><path d="M496 632H658" class="line"/><text x="496" y="660" class="muted" font-size="14">entity_id · label</text>
  </g>
  <text x="324" y="754" class="mono muted small">Arrows show ontology rules, not stored record counts.</text>

  <rect x="1244" y="138" width="314" height="674" rx="10" class="card"/>
  <text x="1274" y="180" class="mono muted label">TYPE INSPECTOR</text>
  <text x="1274" y="224" class="mono green" font-size="27" font-weight="700">Person</text>
  <text x="1274" y="258" class="mono muted small">NODE TYPE</text>
  <path d="M1274 282H1528" class="line"/>
  <text x="1274" y="322" class="mono green label">PROPERTIES</text>
  <text x="1274" y="362" class="mono body small">entity_id</text><text x="1494" y="362" class="mono muted small">TEXT</text>
  <text x="1274" y="400" class="mono body small">name</text><text x="1494" y="400" class="mono muted small">TEXT</text>
  <text x="1274" y="438" class="mono body small">role</text><text x="1494" y="438" class="mono muted small">TEXT</text>
  <path d="M1274 466H1528" class="line"/>
  <text x="1274" y="508" class="mono green label">OUTGOING</text>
  <text x="1274" y="550" class="mono cyan small">OWNS → Project</text>
  <text x="1274" y="592" class="mono cyan small">WORKS_ON → Topic</text>
  <path d="M1274 626H1528" class="line"/>
  <text x="1274" y="668" class="mono green label">WHAT THIS MEANS</text>
  <text x="1274" y="706" class="mono body" font-size="14">Rules describe what may</text>
  <text x="1274" y="730" class="mono body" font-size="14">connect. Data records are</text>
  <text x="1274" y="754" class="mono body" font-size="14">inspected separately.</text>

  <rect x="42" y="830" width="1516" height="28" rx="5" fill="#0a140d"/>
  <text x="62" y="850" class="mono muted" font-size="13">BRAINWIRE / ONTOLOGY PREVIEW</text>
  <text x="1312" y="850" class="mono green" font-size="13">4 TYPES · 4 LINK RULES</text>
</svg>
